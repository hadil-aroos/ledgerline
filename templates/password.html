{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<div class="top"><h1>Change password</h1></div>
<form method="post" class="panel" style="max-width:380px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password</label><input type="password" name="current" autocomplete="current-password" required style="width:100%;margin-bottom:10px">
  <label>New password (8+ characters)</label><input type="password" name="new" minlength="8" autocomplete="new-password" required style="width:100%;margin-bottom:10px">
  <label>Repeat new password</label><input type="password" name="confirm" minlength="8" autocomplete="new-password" required style="width:100%;margin-bottom:14px">
  <button class="btn primary">Change password</button>
</form>
{% endblock %}
